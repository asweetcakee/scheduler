          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                serverError:
                  summary: Internal error
                  value:
                    error: "An unexpected error occurred"
  /masters/{id}/schedule:
    get:
      tags:
        - Masters
      summary: Get master schedule for a date
      operationId: getMasterScheduleForDate
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Master identifier
          schema:
            $ref: '#/components/schemas/IdFormat'
        - name: date
          in: query
          required: true
          description: Calendar date in YYYY-MM-DD format
          schema:
            $ref: '#/components/schemas/DateFormat'
      responses:
        '200':
          description: Schedule for the specified date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterScheduleForDateResponse'
        '400':
          description: Invalid master ID or date format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Master not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Unexpected server or database error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /masters/{id}/schedule/intervals:
    get:
      tags:
        - Masters
      summary: Gets master schedule
      description: Returns all schedule intervals for a master
      operationId: getMasterSchedule
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier for the master
          schema:
            $ref: '#/components/schemas/IdFormat'
      responses:
        '200':
          description: OK - Successfully retrieved master schedule
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MasterScheduleIntervalResponse'
              examples:
                schedule:
                  summary: Master weekly schedule
                  value:
                    - id: 1
                      day_of_week: 1
                      starts_at: "09:00:00"
                      ends_at: "14:00:00"
                    - id: 2
                      day_of_week: 1
                      starts_at: "15:00:00"
                      ends_at: "19:00:00"
                    - id: 3
                      day_of_week: 3
                      starts_at: "10:00:00"
                      ends_at: "18:00:00"
                emptySchedule:
                  summary: Master has no schedule
                  value: []
        '400':
          description: Bad Request - Invalid master ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidId:
                  summary: Invalid ID format
                  value:
                    error: "Master ID must be a valid numeric string"
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found - Master not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  summary: Master not found
                  value:
                    error: "Master not found"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                serverError:
                  summary: Internal error
                  value:
                    error: "An unexpected error occurred"
    post:
      tags:
        - Masters
      summary: Creates a schedule interval
      description: Creates a new working interval for a master on a specific day of the week
      operationId: createMasterScheduleInterval
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier for the master
          schema:
            $ref: '#/components/schemas/IdFormat'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMasterScheduleIntervalRequest'
      responses:
        '201':
          description: Created - Schedule interval created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterScheduleIntervalResponse'
        '400':
          description: Bad Request - Invalid payload or master ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidId:
                  summary: Invalid master ID format
                  value:
                    error: "Master ID must be a valid numeric string"
                invalidDay:
                  summary: Invalid day of week
                  value:
                    error: "Day of week must be between 1 and 7"
                invalidTime:
                  summary: Invalid time format
                  value:
                    error: "Time must be in HH:mm:ss format"
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found - Master not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  summary: Master not found
                  value:
                    error: "Master not found"
        '409':
          description: Conflict - Schedule interval overlaps with an existing interval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                overlap:
                  summary: Overlapping schedule interval
                  value:
                    error: "Schedule interval overlaps with an existing interval"
        '422':
          description: Unprocessable Entity - Business rule is violated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidTimeRange:
                  summary: Invalid time range
                  value:
                    error: "Start time must be earlier than end time"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                serverError:
                  summary: Internal error
                  value:
                    error: "An unexpected error occurred"
  /masters/{id}/schedule/intervals/{intervalId}:
    patch:
      tags:
        - Masters
      summary: Updates a schedule interval
      description: Updates at least one field of an existing schedule interval
      operationId: updateMasterScheduleInterval
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier for the master
          schema:
            $ref: '#/components/schemas/IdFormat'
        - name: intervalId
          in: path
          required: true
          description: Unique identifier for the schedule interval
          schema:
            $ref: '#/components/schemas/IdFormat'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMasterScheduleIntervalRequest'
      responses:
        '200':
          description: OK - Schedule interval updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterScheduleIntervalResponse'
        '400':
          description: Bad Request - Invalid payload or ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidId:
                  summary: Invalid ID format
                  value:
                    error: "ID must be a valid numeric string"
                emptyBody:
                  summary: Empty update request
                  value:
                    error: "At least one field must be provided to perform an update"
                invalidDay:
                  summary: Invalid day of week
                  value:
                    error: "Day of week must be between 1 and 7"
                invalidTime:
                  summary: Invalid time format
                  value:
                    error: "Time must be in HH:mm:ss format"
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found - Master or schedule interval not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                masterNotFound:
                  summary: Master not found
                  value:
                    error: "Master not found"
                intervalNotFound:
                  summary: Schedule interval not found
                  value:
                    error: "Schedule interval not found"
        '409':
          description: Conflict - Schedule interval overlaps with an existing interval
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                overlap:
                  summary: Overlapping schedule interval
                  value:
                    error: "Schedule interval overlaps with an existing interval"
        '422':
          description: Unprocessable Entity - Business rule is violated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidTimeRange:
                  summary: Invalid time range
                  value:
                    error: "Start time must be earlier than end time"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                serverError:
                  summary: Internal error
                  value:
                    error: "An unexpected error occurred"
