                $ref: '#/components/schemas/MasterResponse'
        '400':
          description: Bad Request - Invalid payload or ID format
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidPhone:
                  summary: Invalid phone format
                  value:
                    error: "Phone number must be a 10-digit Kazakhstan number"
                emptyName:
                  summary: Empty name
                  value:
                    error: "Name cannot be empty or blank"
                emptyBody:
                  summary: Empty update request
                  value:
                    error: "At least one field must be provided to perform an update"
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found - Master not found
          content:
            application/json:
              schema:
