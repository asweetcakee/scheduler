        '409':
          description: Conflict - Phone number already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                duplicatePhone:
                  summary: Duplicate phone
                  value:
                    error: "Master with this phone number already exists"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                serverError:
                  summary: Internal error
                  value:
                    error: "An unexpected error occurred"
    delete:
      tags:
        - Masters
      summary: Deletes master
      description: Deletes master by ID
      operationId: removeMaster
