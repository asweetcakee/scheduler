    NameFormat:
      type: string
      minLength: 1
      pattern: '^\s*\S.*$'
      description: Client's name. Cannot be empty or blank
      examples:
        - "Алия"

    NoteFormat:
      type: [string, "null"]
      description: Internal notes. May be passed as null for an empty note
      examples: 
        - null
        - "Has an allergy to a product"
    
    ActiveFormat:
      type: boolean
      description: Indicates that the specialist is an active crew member. Default value - True
      examples: 
        - True
        - False

    PriceFormat:
      type: string
      description: The cost of the service, accurate to two decimal places. In DB used as Numeric, in API contract as String
      examples:
        - "3500.00"

    DurationFormat:
      type: integer
      description: Service duration in seconds
      examples:
        - 3600

