      summary: Deletes service
      description: Deletes service by ID
      operationId: removeService
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier for the service
          schema:
            $ref: '#/components/schemas/IdFormat'
      responses:
        '204':
          description: No Content - Service deleted successfully
        '400':
          description: Bad Request - Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidId:
                  summary: Invalid ID format
                  value:
                    error: "Service ID must be a valid numeric string"
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found - Service not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  summary: Service not found
                  value:
                    error: "Service not found"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                serverError:
                  summary: Internal error
                  value:
                    error: "An unexpected error occurred"
components:
  securitySchemes:
      BearerAuth: 
        type: http
        scheme: bearer
  schemas:
    PingResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          examples: 
            - pong

    HealthResponse:
      type: object
      required:
        - status
        - database
      properties:
        status:
          type: string
          examples: 
            - ok
        database:
          type: string
          examples: 
            - ok

    CreateClientRequest:
      type: object
      required:
        - name
        - phone
      properties:
        name:
          $ref: '#/components/schemas/NameFormat'
        phone:
          $ref: '#/components/schemas/PhoneFormat'
        note:
