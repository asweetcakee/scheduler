              examples:
                allServices:
                  summary: All services
                  value:
                    - id: 1
                      name: “Стрижка мужская”
                      price: "3500.00"
                      duration: 3600
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
