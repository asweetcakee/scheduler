  /services:
    post:
      tags:
        - Services
      summary: Creates a new service
      operationId: createService
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceRequest'
      responses:
        '201': 
          description: Created - Service created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceResponse'
        '400':
          description: Bad Request - Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                emptyName:
                  summary: Empty name
                  value:
                    error: "Service name cannot be empty or blank"
                invalidPrice:
                  summary: Invalid price format and hold numeric value
                  value:
                    error: "Price must follow string format"
                invalidDuration:
                  summary: Invalid duration format
                  value:
                    error: "Duration must follow Integer format"
        '401': 
          description: Unauthorized - Authentication token missing or invalid/expired
        '403':
          description: Forbidden - Insufficient permissions
        '409':
          description: Conflict - Duplicate resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                duplicatePhone:
                  summary: Name exists
                  value:
                    error: "Service with this name already exists"
        '422':
          description: Unprocessable Entity - Business rule is violated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidPrice:
                  summary: CHECK violation - Service price must be >= 0
                  value:
                    error: "Price must be >= 0"
                invalidDuration:
                  summary: CHECK violation - Service duration must be > 0
                  value:
                    error: "Duration must be > 0"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
