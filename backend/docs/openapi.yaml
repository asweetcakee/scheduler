                  summary: Service not found
                  value:
                    error: "Service not found"
        '409':
          description: Conflict - Service name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                duplicatePhone:
                  summary: Name exists
                  value:
                    error: "Service with this name already exists"
        '422':
          description: Unprocessable Entity - Business rule is violated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidPrice:
                  summary: CHECK violation - Service price must be >= 0
                  value:
                    error: "Price must be >= 0"
                invalidDuration:
                  summary: CHECK violation - Service duration must be > 0
                  value:
